<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料査定｜キウチスタイルホーム</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a href="index.html" class="brand">KIUCHI STYLE HOME</a></header><main class="formPage"><div class="formShell" id="shell"><div class="formIntro"><span>FREE ASSESSMENT</span><h1>不動産の無料査定</h1><p>わかる範囲だけで大丈夫です。最短1分で送信できます。</p></div><form id="inquiryForm" class="formGrid"><label>物件種別<select name="type" required><option value="">選択してください</option><option>中古戸建</option><option>土地</option><option>古家付き土地</option><option>区分マンション</option><option>一棟物件</option><option>その他</option></select></label><label>物件所在地<input name="address" placeholder="例：千葉県香取郡神崎町〇〇" required></label><label>希望売却価格<input name="asking" placeholder="例：80万円 / 未定"></label><label>築年数<input name="age" placeholder="例：築35年 / 不明"></label><label>現在の状態<select name="condition"><option>空き家</option><option>居住中</option><option>賃貸中</option><option>更地</option><option>古家あり</option><option>不明</option></select></label><label>売却希望時期<select name="timing"><option>できるだけ早く</option><option>3ヶ月以内</option><option>半年以内</option><option>1年以内</option><option>未定</option></select></label><label class="wide">物件について<textarea name="note" rows="4" placeholder="残置物あり、雨漏りあり、相続したばかり等"></textarea></label><label>お名前<input name="name" required></label><label>電話番号<input name="phone" inputmode="tel" required></label><label class="wide">メールアドレス<input name="email" type="email"></label><button class="submitBtn" type="submit">無料査定を依頼する →</button></form></div></main><script src="app.js"></script></body></html>
